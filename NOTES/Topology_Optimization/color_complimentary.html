<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complementary Color Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 2rem auto;
    padding: 1rem;
}

.controls{
    margin-bottom: 2rem;
}

.preview{
    display:flex;
    gap:1rem;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:220px;
    border:1px solid #ccc;
    border-radius:10px;
    overflow:hidden;
}

.color-box{
    height:120px;
}

.info{
    padding:1rem;
}

code{
    background:#eee;
    padding:0.2rem 0.4rem;
    border-radius:4px;
}
</style>
</head>
<body>

<h2>Complementary Color Generator</h2>

<div class="controls">
    <input type="color" id="colorPicker" value="#3498db">
</div>

<div class="preview">

    <div class="card">
        <div id="originalBox" class="color-box"></div>
        <div class="info">
            <strong>Original</strong><br>
            <code id="originalHex"></code>
        </div>
    </div>

    <div class="card">
        <div id="lightBox" class="color-box"></div>
        <div class="info">
            <strong>Light Mode Complement</strong><br>
            <code id="lightHex"></code>
        </div>
    </div>

    <div class="card">
        <div id="darkBox" class="color-box"></div>
        <div class="info">
            <strong>Dark Mode Complement</strong><br>
            <code id="darkHex"></code>
        </div>
    </div>

</div>

<script>

// HEX → RGB
function hexToRgb(hex){
    const num = parseInt(hex.slice(1),16);
    return {
        r:(num>>16)&255,
        g:(num>>8)&255,
        b:num&255
    };
}

// RGB → HEX
function rgbToHex(r,g,b){
    return "#" +
        [r,g,b]
        .map(v => Math.round(v).toString(16).padStart(2,"0"))
        .join("");
}

// RGB → HSL
function rgbToHsl(r,g,b){
    r/=255; g/=255; b/=255;

    const max=Math.max(r,g,b);
    const min=Math.min(r,g,b);

    let h,s,l=(max+min)/2;

    if(max===min){
        h=s=0;
    }else{
        const d=max-min;

        s=l>0.5
            ? d/(2-max-min)
            : d/(max+min);

        switch(max){
            case r:
                h=(g-b)/d+(g<b?6:0);
                break;
            case g:
                h=(b-r)/d+2;
                break;
            case b:
                h=(r-g)/d+4;
                break;
        }
        h*=60;
    }

    return {h,s,l};
}

// HSL → RGB
function hslToRgb(h,s,l){

    const c=(1-Math.abs(2*l-1))*s;
    const x=c*(1-Math.abs((h/60)%2-1));
    const m=l-c/2;

    let r=0,g=0,b=0;

    if(h<60){ r=c; g=x; }
    else if(h<120){ r=x; g=c; }
    else if(h<180){ g=c; b=x; }
    else if(h<240){ g=x; b=c; }
    else if(h<300){ r=x; b=c; }
    else{ r=c; b=x; }

    return {
        r:(r+m)*255,
        g:(g+m)*255,
        b:(b+m)*255
    };
}

function updateColors(hex){

    const rgb = hexToRgb(hex);
    const hsl = rgbToHsl(rgb.r,rgb.g,rgb.b);

    // Complementary hue
    const compHue = (hsl.h + 180) % 360;

    // Light mode version
    const lightRgb = hslToRgb(
        compHue,
        Math.max(0.45,hsl.s),
        0.45
    );

    // Dark mode version
    const darkRgb = hslToRgb(
        compHue,
        Math.max(0.50,hsl.s),
        0.65
    );

    const lightHex = rgbToHex(
        lightRgb.r,
        lightRgb.g,
        lightRgb.b
    );

    const darkHex = rgbToHex(
        darkRgb.r,
        darkRgb.g,
        darkRgb.b
    );

    document.getElementById("originalBox").style.background = hex;
    document.getElementById("lightBox").style.background = lightHex;
    document.getElementById("darkBox").style.background = darkHex;

    document.getElementById("originalHex").textContent = hex;
    document.getElementById("lightHex").textContent = lightHex;
    document.getElementById("darkHex").textContent = darkHex;
}

const picker = document.getElementById("colorPicker");

picker.addEventListener("input", e=>{
    updateColors(e.target.value);
});

updateColors(picker.value);

</script>

</body>
</html>
